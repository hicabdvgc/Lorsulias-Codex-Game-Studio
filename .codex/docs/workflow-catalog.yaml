resource_procedures:
- name: Resource preparation
  guidance: .codex/docs/resource-preparation.md
  execution: manual or selected existing tools
- name: Tool development
  guidance: .codex/docs/tool-development.md
  execution: assigned available executor; actual intended-user evaluation required
work_preparation:
  guidance: .codex/docs/work-preparation.md
  status_authority: Story header Status; sprint YAML derives selected sprint membership statuses.
  root_resolution: .codex/docs/code-root-resolution.md
  runner_references: .codex/docs/testing-engine-reference.md
  observer: .codex/scripts/story-status.sh (read-only; no lifecycle registration)
  milestones: Final authoring follows epic/story preparation and the vertical-slice hard gate;
    early drafts retain missing evidence.
execution:
  guidance: .codex/docs/execution-and-evidence.md
  progression: .codex/docs/progression.md
  stage_marker: production/stage.txt; declared catalog section only
  playtests: production/playtests/
  artifact_observer: .codex/scripts/artifact-check.sh; discovery only
  gap_observer: .codex/hooks/detect-gaps.sh; explicit observer and bounded SessionStart startup/resume/clear
    discovery
release:
  guidance: .codex/docs/release-and-operations.md
  requirements: production/releases/RELEASE_CHECKLIST.md
  internal_reports: production/releases/release-checklist-[date].md
  external_reports: production/launch/launch-checklist-[date].md
  patch_notes: production/releases/[version]/patch-notes.md
  meaning: Reports need exact candidate/baseline evidence. READY does not authorize delivery.
continuity:
  guidance: .codex/docs/context-management.md
  checkpoint: production/session-state/active.md
  parser: .codex/scripts/session-state.py
  rotation: .codex/scripts/rotate-session-state.sh; explicit only
optional_support:
- name: Project coherence observation
  guidance: .codex/docs/project-coherence.md
  observer: .codex/scripts/project-coherence.sh
  meaning: Explicit project scope; compares declarations and metadata without executing commands or establishing readiness.
- name: Pitch authoring aid
  guidance: .codex/docs/templates/pitch-document.md
  meaning: Optional presentation of developer decisions and sourced evidence; no additional workflow gate.
